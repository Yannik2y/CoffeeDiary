name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        id: xcode
        run: |
          # Prefer Xcode 27.1 for iPhone Duo APIs when the image provides it.
          if [ -d /Applications/Xcode_27.1.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
            echo "duo=1" >> "$GITHUB_OUTPUT"
            echo "Selected Xcode 27.1 (Duo APIs enabled)"
          elif [ -d /Applications/Xcode_27.1.0.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.1.0.app/Contents/Developer
            echo "duo=1" >> "$GITHUB_OUTPUT"
            echo "Selected Xcode 27.1.0 (Duo APIs enabled)"
          else
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
            echo "duo=0" >> "$GITHUB_OUTPUT"
            echo "Selected Xcode 16.4 (Duo APIs compiled out)"
          fi
          xcodebuild -version
      - name: Show available simulators
        run: xcrun simctl list devices available | head -80
      - name: Resolve build destination
        id: dest
        run: |
          if [ "${{ steps.xcode.outputs.duo }}" = "1" ]; then
            # Prefer Duo simulator; fall back to a modern iPhone.
            if xcrun simctl list devices available | grep -q "iPhone Duo"; then
              echo "destination=platform=iOS Simulator,name=iPhone Duo" >> "$GITHUB_OUTPUT"
            else
              echo "destination=platform=iOS Simulator,name=iPhone 16,OS=18.5" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "destination=platform=iOS Simulator,name=iPhone 16,OS=18.5" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        run: |
          EXTRA=()
          if [ "${{ steps.xcode.outputs.duo }}" = "1" ]; then
            EXTRA+=(DUO_COMPILATION_CONDITIONS=ENABLE_DUO_APIS)
          fi
          xcodebuild -scheme CoffeeDiary \
            -destination '${{ steps.dest.outputs.destination }}' \
            "${EXTRA[@]}" \
            -quiet build
      - name: Test
        # TipJarReviewScreenshotTests is a local StoreKit screenshot helper for App Store review;
        # skip it on CI (XCTSkip from setUp is still reported as failure by xcodebuild).
        run: |
          EXTRA=()
          if [ "${{ steps.xcode.outputs.duo }}" = "1" ]; then
            EXTRA+=(DUO_COMPILATION_CONDITIONS=ENABLE_DUO_APIS)
          fi
          xcodebuild -scheme CoffeeDiary \
            -destination '${{ steps.dest.outputs.destination }}' \
            -skip-testing:CoffeeDiaryUITests/TipJarReviewScreenshotTests \
            "${EXTRA[@]}" \
            -quiet test
        env:
          CI: true
