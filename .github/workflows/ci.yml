name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Show available simulators
        run: xcrun simctl list devices available | head -80
      - name: Build
        run: xcodebuild -scheme CoffeeDiary -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.5' -quiet build
      - name: Test
        # TipJarReviewScreenshotTests is a local StoreKit screenshot helper for App Store review;
        # skip it on CI (XCTSkip from setUp is still reported as failure by xcodebuild).
        run: >
          xcodebuild -scheme CoffeeDiary
          -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.5'
          -skip-testing:CoffeeDiaryUITests/TipJarReviewScreenshotTests
          -quiet test
        env:
          CI: true
